# Pruebas automáticas con datos ficticios en cada cambio de código.
name: Pruebas

on:
  push:
    branches: [main]
    paths: ["colector/**", "config/**", "tests/**", "scripts/**", "requirements*.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Recuperar capas de regiones
        id: cache-regiones
        uses: actions/cache/restore@v6
        with:
          path: |
            web/geo/regiones.geojson
            web/geo/mares.geojson
            web/geo/ciudades.geojson
            web/geo/limites.geojson
            web/geo/mares-et.geojson
            web/fonts/Noto Sans Regular
            web/fonts/Noto Sans Medium
            web/fonts/Noto Sans Italic
            web/fonts/OFL-Noto-Sans.txt
            colector/recursos/regiones.json
          key: regiones-v2-${{ hashFiles('scripts/preparar_regiones.py', 'config/conflictos.yaml') }}

      - name: Generar capas de regiones (Natural Earth)
        id: gen-regiones
        if: steps.cache-regiones.outputs.cache-hit != 'true'
        run: python scripts/preparar_regiones.py && echo "listas=1" >> "$GITHUB_OUTPUT"

      - name: Guardar capas de regiones
        if: steps.gen-regiones.outputs.listas == '1'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            web/geo/regiones.geojson
            web/geo/mares.geojson
            web/geo/ciudades.geojson
            web/geo/limites.geojson
            web/geo/mares-et.geojson
            web/fonts/Noto Sans Regular
            web/fonts/Noto Sans Medium
            web/fonts/Noto Sans Italic
            web/fonts/OFL-Noto-Sans.txt
            colector/recursos/regiones.json
          key: regiones-v2-${{ hashFiles('scripts/preparar_regiones.py', 'config/conflictos.yaml') }}

      - run: python -m colector validar
      - run: python -m pytest -q
