# Pruebas automáticas con datos ficticios en cada cambio de código.
name: Pruebas

on:
  push:
    branches: [main]
    paths: ["colector/**", "config/**", "tests/**", "requirements*.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m colector validar
      - run: python -m pytest -q
