# Fuentes consultadas en cada ciclo.
#
# tipo:        medio | agencia | oficial (gobierno) | organismo (internacional/ONG)
# propiedad:   privada | publica (servicio público con independencia editorial) | estatal
#              (controlado por un gobierno) | estatal_financiado (financiado por un Estado)
# extracto:    si es true se muestra un extracto breve del resumen que publica la fuente en su
#              RSS (traducido y atribuido). Si es false solo se muestra el titular y el enlace.
# licencia:    lo verificado sobre condiciones de uso. "rss_editor" = RSS público ofrecido por el
#              editor para sindicación; solo se muestra titular, extracto breve y enlace al original.
# Retiradas tras la primera prueba real (14/10/2026): OTAN (el sitio ya no ofrece RSS, 404),
# Departamento de Estado de EE.UU. (403), Sudan Tribune y Addis Standard (403, bloqueo de bots),
# The Times of Israel (robots.txt no permite la descarga) y ReliefWeb (feed sin entradas).
# Antes de descargar, el colector respeta robots.txt de cada sitio y usa peticiones condicionales
# (ETag / Last-Modified). Una fuente que falla no detiene el ciclo: se marca en el estado público.

usuario_agente: "MapaConflictosBot/1.0 (+{url_sitio}; recopilacion personal de titulares)"

gdelt:
  activo: true
  # Archivos de 15 minutos de GDELT 2.0: Eventos (lugar del hecho) y GKG (título, temas, lugares),
  # en inglés y traducidos ("translingual"). Términos: uso libre con cita a GDELT y enlace.
  url_base: "http://data.gdeltproject.org/gdeltv2/"
  ventana_horas: 3          # se revisan los archivos de las últimas 3 h (ventanas solapadas)
  max_archivos_por_ciclo: 8 # tope de archivos nuevos por ciclo (por flujo) para acotar el tiempo
  max_registros_traducir: 600
  cita: "The GDELT Project (https://www.gdeltproject.org/)"

