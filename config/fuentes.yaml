# Agencias de noticias: si un artículo atribuye su contenido a una agencia, la agencia cuenta
# como el origen (no el medio que la reproduce).
agencias:
  Reuters: ["Reuters", "(Reuters)"]
  Associated Press: ["Associated Press", "(AP)", "AP Photo", "— AP", "- AP"]
  AFP: ["AFP", "Agence France-Presse", "(AFP)"]
  EFE: ["EFE", "(EFE)", "Agencia EFE"]
  dpa: ["dpa", "(dpa)"]
  ANSA: ["ANSA", "(ANSA)"]
  Europa Press: ["Europa Press", "(Europa Press)"]
  Xinhua: ["Xinhua"]
