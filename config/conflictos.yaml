  categoria: otro_armado
  estado: activo
  revisado: 2026-10-13
  resumen: >-
    Israel y Hezbolá combaten desde el 2 de marzo de 2026, tras los ataques contra Irán, e Israel
    ocupa partes del sur del Líbano. Pese al marco trilateral firmado el 26 de junio, siguen los
