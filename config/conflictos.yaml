    La tregua de octubre de 2025 en Gaza sigue formalmente vigente, pero con ataques israelíes letales
    (más de 130 muertos en septiembre de 2026, según Crisis Group) y una situación humanitaria grave.
    En Cisjordania aumentan los ataques de colonos contra palestinos y las incursiones militares israelíes.
