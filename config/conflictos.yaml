# Registro de conflictos y situaciones vigentes.
#
# Cada entrada está respaldada por fuentes fechadas (campo "fuentes") y tiene fecha de última
# revisión humana ("revisado"). La inclusión NO se decide por memoria: se verificó con fuentes
# consultadas el 13/10/2026 (Crisis Group CrisisWatch sept. 2026, Security Council Report oct. 2026,
# Wikipedia "List of ongoing armed conflicts" y noticias recientes).
#
# Un conflicto NO se da por terminado automáticamente por falta de noticias: solo cambia su
# "estado" con una revisión humana (editar este archivo). Si "revisado" tiene más de 90 días,
# la web muestra "revisión pendiente".
#
# Campos de "coincidencias" (cómo se asignan artículos a cada conflicto):
#   fuertes:   cualquiera de estos términos asigna el artículo (sin requerir vocabulario).
#   lugares:   términos de lugar/actor que requieren además vocabulario de la categoría.
#   grupos:    lista de grupos; TODOS deben aparecer (al menos un término de cada uno) + vocabulario.
#   paises_nombre: países cuyos nombres (en ~20 idiomas, de Natural Earth) cuentan como "lugares".
#   paises_gdelt:  países cuya mención geográfica en GDELT + temas de conflicto armado asigna el artículo.
#   quitar:    frases que se eliminan antes de evaluar "lugares" (p. ej. "South Sudan" para "Sudan").
# Términos en MAYÚSCULAS de hasta 5 letras (siglas) distinguen mayúsculas.

conflictos:

- id: ucrania-rusia
  nombre: Guerra Rusia–Ucrania
  categoria: guerra_estados
  estado: activo
  revisado: 2026-10-13
  resumen: >-
    Guerra a gran escala desde la invasión rusa de febrero de 2022 (conflicto iniciado en 2014).
    En septiembre y octubre de 2026 siguen los combates en Donetsk, los ataques rusos con misiles
    y drones contra ciudades e infraestructura energética de Ucrania y los ataques ucranianos contra
    refinerías y aeródromos en Rusia. Las conversaciones con mediación de EE.UU. están estancadas.
  actores: [Fuerzas Armadas de Rusia, Fuerzas Armadas de Ucrania]
  paises_escenario: [UKR, RUS]
  paises_participantes: [BLR]
  partes:
    - {nombre: Rusia, paises: [RUS]}
    - {nombre: Ucrania, paises: [UKR]}
  zonas: [ne-crimea]
  fuentes:
    - {medio: Al Jazeera, fecha: 2026-10-09, titulo: "Ukraine pushes Russia back in Donetsk as military, civilian casualties soar", url: "https://www.aljazeera.com/news/2026/10/9/ukraine-pushes-russia-back-in-donetsk-as-military-civilian-casualties-soar"}
    - {medio: International Crisis Group, fecha: 2026-10-01, titulo: "CrisisWatch – Europa y Asia Central, septiembre de 2026 (Ucrania, Rusia)", url: "https://www.crisisgroup.org/sites/default/files/crisiswatch/crisiswatch-september-2026-europe-and-central-asia.pdf"}
  coincidencias:
