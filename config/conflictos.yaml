- id: yemen
  nombre: Guerra en Yemen y ataques hutíes contra Arabia Saudita
  categoria: guerra_civil
  estado: activo
  revisado: 2026-10-13
  resumen: >-
    En septiembre de 2026 se rompió la tregua de 2022: los hutíes tomaron Moca y gran parte de la
    costa del mar Rojo hasta Bab el-Mandeb, intensificaron sus ataques sobre Taiz y lanzaron misiles
    y drones contra ciudades saudíes. Arabia Saudita intensifica los bombardeos en apoyo del gobierno
    reconocido internacionalmente y prepara una ofensiva. También hay ataques a la navegación en el mar Rojo.
  actores: [Hutíes (Ansar Allah), Gobierno yemení reconocido internacionalmente, Coalición liderada por Arabia Saudita]
