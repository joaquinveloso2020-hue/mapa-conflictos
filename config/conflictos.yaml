- id: iran-guerra
  nombre: Guerra de Irán (EE.UU. e Israel contra Irán y sus aliados)
  categoria: guerra_estados
  estado: activo
  revisado: 2026-10-13
  resumen: >-
    Desde el 28 de febrero de 2026, ataques de EE.UU. e Israel contra Irán y represalias iraníes
    contra Israel, bases estadounidenses y países del Golfo, con una crisis en el estrecho de Ormuz.
    Tras treguas fallidas, a comienzos de septiembre de 2026 hubo nuevos intercambios de ataques y
    luego una pausa con gestiones diplomáticas sin acuerdo; a mediados de octubre se informan nuevos
    ataques en Ormuz.
